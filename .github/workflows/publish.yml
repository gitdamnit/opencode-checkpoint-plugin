name: Publish to npm

# Carried over from the local working tree of the 1.0.x line, where it ran on
# `release: published`.
#
# It is now MANUAL ONLY, on purpose. Publishing a GitHub release must never
# publish to npm as a side effect: the 2.0.0 release is created with npm
# publication deliberately withheld pending explicit maintainer approval, and an
# automatic trigger would make that impossible to guarantee.
#
# To publish after approval, run this workflow from the Actions tab (or
# `gh workflow run publish.yml -f tag=v2.0.0`) and pass the released tag. The
# workflow checks that tag out and refuses to publish unless it matches
# package.json.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Released git tag to publish, e.g. v2.0.0 (must match package.json version)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the requested tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Verify the requested tag matches package.json
        run: |
          set -eu
          tag="${{ inputs.tag }}"
          pkg_version="$(node -p "require('./package.json').version")"
          tag_version="${tag#v}"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "Requested tag ($tag) does not match package.json ($pkg_version)" >&2
            exit 1
          fi
          echo "Publishing $pkg_version from tag $tag"

      - name: Lint, typecheck, build, test
        run: |
          npm run lint
          npm run typecheck
          npm run build
          npm test

      - name: Publish
        run: npm publish --access public
